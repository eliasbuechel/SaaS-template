services:
  customer-dashboard:
    image: customer-dashboard
    container_name: customer-dashboard
    build:
      context: ../../frontend/customer-dashboard
      dockerfile: ../../frontend/customer-dashboard/Dockerfile.local.dockerfile
    env_file:
      - ../../frontend/customer-dashboard/.env
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend/customer-dashboard:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null http://localhost:3000 || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s