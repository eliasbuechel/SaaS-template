services:
  shopify-service:
    image: shopify-service
    container_name: shopify-service
    build:
      context: .
      dockerfile: Dockerfile.local.dockerfile
    env_file:
      - .env.local
      - .env.secret
    ports:
      - "4010:4010"
    networks:
      - shopify-service-redis-db-network
    depends_on:
      shopify-service-redis-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null http://localhost:4010/healthy || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
      
  shopify-service-redis-db:
    image: redis:alpine
    container_name: shopify-service-redis-db
    restart: always
    volumes:
      - shopify-service-redis-db-data:/data
    networks:
      - shopify-service-redis-db-network
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  shopify-service-redis-db-data:
    
networks:
  shopify-service-redis-db-network:
    driver: bridge