services:
  auth-service:
    image: auth-service
    container_name: auth-service
    build:
     context: .
     dockerfile: Dockerfile.local.dockerfile
    env_file:
      - .env.local
      - .env.secret
    ports:
      - "4000:4000"
    networks:
      - auth-service-redis-db-network
      - auth-service-postgres-db-network
    depends_on:
      auth-service-postgres-db:
        condition: service_healthy
      auth-service-redis-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null http://localhost:4000/healthy || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  auth-service-postgres-db:
    image: postgres:14
    container_name: auth-service-postgres-db
    restart: always
    env_file:
      - .env.auth-service-postgres-db.secret
    volumes:
      - auth-service-postgres-db-data:/var/lib/postgresql/data
    networks:
      - auth-service-postgres-db-network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      
  auth-service-redis-db:
    image: redis:alpine
    container_name: auth-service-redis-db
    restart: always
    volumes:
      - auth-service-redis-db-data:/data
    networks:
      - auth-service-redis-db-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  auth-service-redis-db-data:
  auth-service-postgres-db-data:

networks:
  auth-service-redis-db-network:
    driver: bridge
  auth-service-postgres-db-network:
    driver: bridge