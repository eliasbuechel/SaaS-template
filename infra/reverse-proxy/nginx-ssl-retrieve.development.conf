# Global settings
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Events block (required)
events {
    worker_connections  1024;
}

# HTTP block: Contains MIME types, logging, and your server block
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log settings (optional)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    
    
    ### dev.murpheuz.com → customer-dashboard:3000 ###
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name dev.murpheuz.com;

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot/;
            allow all;
        }

        location / {
            proxy_pass http://customer-dashboard:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ### dev.auth.murpheuz.com → auth-service:4000 ###
    server {
        listen 80;
        listen [::]:80;
        server_name dev.auth.murpheuz.com;

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot/;
            allow all;
        }

        location / {
            proxy_pass http://auth-service:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


    #### dev.shopify.murpheuz.com → shopify-service:4010 ####
    server {
        listen 80;
        listen [::]:80;
        server_name dev.shopify.murpheuz.com;

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot/;
            allow all;
        }

        location / {
            proxy_pass http://shopify-service:4010;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
