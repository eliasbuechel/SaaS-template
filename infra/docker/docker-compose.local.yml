services:
  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: ../../backend/auth-service/Dockerfile.local.dockerfile
    env_file:
      - ../../backend/auth-service/.env.local
      - ../../backend/auth-service/.env.secret
    volumes:
      - ../../backend/auth-service:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
  
  shopify-service:
    build:
      context: ../../backend/shopify-service
      dockerfile: ../../backend/shopify-service/Dockerfile.local.dockerfile
    env_file:
      - ../../backend/shopify-service/.env.local
      - ../../backend/shopify-service/.env.secret
    volumes:
      - ../../backend/shopify-service:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  customer-dashboard:
    build:
      context: ../../frontend/customer-dashboard
      dockerfile: ../../frontend/customer-dashboard/Dockerfile.local.dockerfile
    env_file:
      - ../../frontend/customer-dashboard/.env
    volumes:
      - ../../frontend/customer-dashboard:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true